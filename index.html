<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171716">
  <meta name="description" content="Seven films. One Tuesday evening. Choose a world to step into on 27 October.">
  <title>Tuesday’s pick — a little cinema</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/grand-1-scenery.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="style.css?v=centered-tiles-1">
  <script src="app.js?v=centered-tiles-1" defer></script>
  <script src="snap.js?v=centered-tiles-1" defer></script>
</head>
<body>
  <a class="skip-link" href="#films">Skip to the films</a>
  <header class="masthead" id="top">
    <div class="masthead-meta"><time datetime="2026-10-27">TUESDAY, 27 OCTOBER</time></div>
    <h1>Choose Tuesday’s mood<span class="title-period">.</span></h1>
    <a href="#films" class="explore">Take a look <span aria-hidden="true">↓</span></a>
  </header>
  <main id="films" aria-label="Seven films to choose from"></main>
  <aside class="pick-bar" hidden aria-label="Your selected film"><div><span>TUESDAY’S PICK</span><strong id="pick-bar-title"></strong></div><button id="pick-bar-open" type="button">Your ticket <span aria-hidden="true">↗</span></button><button class="pick-clear" type="button" aria-label="Clear your selection">×</button></aside>
  <dialog id="ticket-dialog" class="ticket-dialog" aria-labelledby="ticket-heading">
    <div class="ticket-wrap"><button class="dialog-close" type="button" aria-label="Close ticket">×</button><div class="ticket-top"><span>A LITTLE CINEMA</span><span>27 OCT 2026</span></div><p class="ticket-eyebrow">TUESDAY’S PICK</p><h2 id="ticket-heading"></h2><p class="ticket-year"></p><img class="ticket-poster" alt=""><p class="ticket-question"></p><div class="ticket-perforation" aria-hidden="true"></div><button id="copy-choice" type="button">Copy Tuesday’s pick <span aria-hidden="true">↗</span></button><button class="keep-looking" type="button">Keep looking</button><p class="copy-status" aria-live="polite"></p></div>
  </dialog>
  <noscript><p class="noscript">Enable JavaScript to explore the seven films and choose Tuesday’s pick.</p></noscript>
</body>
</html>
